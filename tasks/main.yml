---
# --------------------------------

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-rust"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-rust"]

- name: "Copy install script over"
  ansible.builtin.copy:
    dest: "{{ rust_installer }}"
    group: root
    owner: root
    mode: "0755"
    src: "install-rustup.sh"
  become: true
  tags: ["ct-rust"]

- name: "Run install script"
  ansible.builtin.command:
    cmd: "{{ rust_installer }} -y"
  args:
    creates: ~{{ item }}/{{ rust_flag }}
  loop: "{{ rust_users }}"
  become: true
  become_user: "{{ item }}"
  tags: ["ct-rust"]

- name: "Install dependencies"
  ansible.builtin.apt:
    name: "{{ rust_other_pkgs }}"
    state: present
  become: true
  tags: ["ct-rust"]

